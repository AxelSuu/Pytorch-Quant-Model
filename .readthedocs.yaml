# Read the Docs build configuration (PYQ-234).
#
# Docs: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Two decisions worth recording, because both were made on measured evidence
# rather than preference:
#
# 1. This is a REAL install, not `autodoc_mock_imports`. Mocked imports produce
#    wrong signatures for anything that inspects a base class, and this codebase
#    returns and subclasses upstream types in several public signatures --
#    `make_dataset() -> TimeSeriesDataSet`, `build_model() -> TemporalFusionTransformer`,
#    every `pd.DataFrame`. Those resolving to live upstream documentation via
#    intersphinx is the whole reason PYQ-232 chose Sphinx over MkDocs; mocking
#    them would quietly delete that.
#
# 2. But NOT the CUDA build of torch. Measured locally: a default
#    `uv sync --group docs` produces a 5.2 GB environment (torch 1.2 GB plus
#    2.7 GB of `nvidia-*` CUDA runtime wheels), which does not fit a Read the
#    Docs builder. `--torch-backend=cpu` pins the CPU wheels instead: 1.2 GB,
#    and `sphinx-build -W --keep-going` completed in 43 s against it with byte-
#    identical output. No GPU is involved in importing a module for autodoc, so
#    nothing is lost.
#
# That is the middle path the ticket asked for: keep the real install, drop only
# the part of it that is dead weight for a documentation build.

version: 2

build:
  os: ubuntu-24.04
  tools:
    # `uv` is preinstalled on the ubuntu-24.04 builder image, which is what
    # makes this a short config file rather than a pip-shim workaround.
    python: "3.12"
  jobs:
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      # `.` installs the project and its runtime dependencies; `--group docs`
      # adds the PEP 735 documentation group from pyproject.toml, which never
      # ships to installers. `--extra api` is also required here, not only for
      # users of the FastAPI layer: pyquant/api/{app,deps,routes/*}.py import
      # fastapi at module level, autodoc actually imports every module it
      # documents, and `fail_on_warning` below means a missing extra fails the
      # whole build over one section most readers never open (PYQ-264).
      - uv pip install --python "${READTHEDOCS_VIRTUALENV_PATH}" --torch-backend=cpu --group docs --extra api .

sphinx:
  configuration: docs/conf.py
  # The same gate CI applies (PYQ-233). A hosted site that silently drops a
  # renamed module is worse than no hosted site, because it looks current.
  fail_on_warning: true
