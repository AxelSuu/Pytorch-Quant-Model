# PyQuant experiment config — wider quantiles, higher capacity (PYQ-209).
#
# A more aggressive variant: a larger model, a wider prediction interval, and a
# lower learning rate over more epochs. Only the fields that differ from the
# defaults need to be listed. Usage:
#   uv run pyquant train AAPL --config configs/wide_quantile_aggressive.yaml

tft:
  hidden_size: 64
  hidden_continuous_size: 32
  quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]

training:
  max_epochs: 50
  learning_rate: 0.005
