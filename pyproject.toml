[project]
name = "pyquant"
version = "0.2.0"
description = "Multi-modal market research tool: Temporal Fusion Transformer forecasts with uncertainty bands and interpretability."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Axel" }]
dependencies = [
    # Core ML / forecasting
    "torch>=2.2",
    "pytorch-forecasting>=1.0",
    "lightning>=2.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    # Data sources
    "yfinance>=0.2.40",
    "fredapi>=0.5",
    "requests>=2.31",
    # CLI / UI
    "typer>=0.12",
    "rich>=13.7",
    "plotext>=5.2",
    "matplotlib>=3.8",
    # Config
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# News sentiment via FinBERT runs locally through HuggingFace transformers.
# Optional so the base install stays lean; sentiment features degrade gracefully when absent.
sentiment = [
    "transformers>=4.40",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
]

[project.scripts]
pyquant = "pyquant.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyquant"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
