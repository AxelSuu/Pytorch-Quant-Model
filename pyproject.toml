[project]
name = "pyquant"
version = "0.2.0"
description = "Multi-modal market research tool: Temporal Fusion Transformer forecasts with uncertainty bands and interpretability."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Axel" }]
# Majors are capped on the dependencies whose breaking changes would silently
# change model *outputs* rather than fail loudly (PYQ-228). yfinance is the
# pointed case: the declared `>=0.2.40` had already resolved to 1.4.1, whose
# `Ticker.history` signature is just `(self, *args, **kwargs)`, and its
# `auto_adjust` default flipped mid-0.2.x -- which changes every price level and
# therefore every indicator and every trained model. `uv.lock` protects
# developers and CI; it protects nobody who installs the package, and it did not
# prevent that jump. The rest keep open upper bounds: capping everything ages
# badly and PYQ-310's disposition is that a constraint should earn its place.
dependencies = [
    # Core ML / forecasting
    "torch>=2.2,<3",
    "pytorch-forecasting>=1.0,<2",
    "lightning>=2.2,<3",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    # Data sources
    "yfinance>=0.2.40,<2",
    "fredapi>=0.5",
    "requests>=2.31",
    # CLI / UI
    "typer>=0.12",
    "rich>=13.7",
    "plotext>=5.2",
    "matplotlib>=3.8",
    # Config
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# News sentiment via FinBERT runs locally through HuggingFace transformers.
# Optional so the base install stays lean; sentiment features degrade gracefully when absent.
sentiment = [
    "transformers>=4.40",
]
# Optuna-backed hyperparameter search (PYQ-253, `pyquant tune`). pytorch-forecasting
# itself gates optimize_hyperparameters() behind its own "tuning" extra with these
# same bounds; matched here rather than widened, since it is pytorch-forecasting's
# own compatibility contract, not ours to loosen.
tuning = [
    "optuna>=3.1,<5",
    "optuna-integration",
    "statsmodels",
    # optimize_hyperparameters() unconditionally constructs a TensorBoardLogger
    # (not passed through trainer_kwargs) -- a hard runtime dependency pytorch-
    # forecasting's own "tuning" extra doesn't declare but its error message
    # points straight at.
    "tensorboard",
]
# FastAPI service layer (PYQ-261), per the design note in docs/api-design.md.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    # Coverage is measured, not gated (PYQ-230). Justified against doing nothing:
    # investigations.md#pyq-304 was closed on a one-off local run whose number is
    # already stale and unverifiable, and bugs.md#pyq-120 proved the interesting
    # question is *which* paths are uncovered, not whether coverage exists.
    # Dev-extra only, so it never reaches an installer.
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

# PEP 735 group rather than an optional-dependency extra, so the docs toolchain
# never ships to installers (PYQ-232). Build with:
#   uv run --group docs sphinx-build -b html docs docs/_build/html
[dependency-groups]
docs = [
    "sphinx>=7.3",
    "furo>=2024.1",
    "myst-parser>=3.0",
    "sphinx-autobuild>=2024.2",
]

[project.scripts]
pyquant = "pyquant.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyquant"]
# PEP 561 marker. The codebase is fully annotated and mypy-clean (PYQ-310), but
# without this file no downstream consumer's type checker will use any of it --
# the annotations are invisible outside the package (PYQ-260). Matters for the
# planned API layer and for anyone importing pyquant as a library.
force-include = { "pyquant/py.typed" = "pyquant/py.typed" }

[tool.ruff]
line-length = 100
target-version = "py310"
# backlog/_archive/ is a frozen historical record (old backlog.py + its data),
# archived rather than deleted when the backlog migrated to GitHub Issues --
# "no longer live or enforced by CI" per CLAUDE.md. Linting dead code for style
# would mean either maintaining it again or peppering a historical snapshot
# with ignore comments it never had; excluding it keeps the snapshot verbatim.
exclude = ["backlog/_archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
# B008: typer.Option/Argument in defaults is the intended Typer pattern.
ignore = ["E501", "B008"]

# Docstring style is now a rule rather than a habit (PYQ-236). Enabling `D` on
# the current tree found 19 issues in `pyquant/`, every one of them a *missing*
# docstring (D101/D102/D103/D104) and not one a style violation -- so the
# existing prose already is Google-convention, and `convention = "google"` also
# auto-disables the D203/D213/D215/D4xx family that fights it. That is why there
# is no hand-maintained ignore list here, unlike what the ticket anticipated.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# `D` is deliberately scoped to `pyquant/` (PYQ-236). Tree-wide it produced 201
# findings, 176 of them D103 on test functions -- and this project's testing
# convention is that a test's *name* carries the specification
# (`test_walk_forward_window_validation_targets_its_own_origin`), which a
# docstring rule would dilute rather than enforce. `scripts/` and `docs/conf.py`
# are build/maintenance configuration, not public API.
"tests/**" = ["D"]
"scripts/**" = ["D"]
"docs/**" = ["D"]
# Seven public symbols were still undocumented when `D` was switched on, all in
# files under concurrent edit in the same pass, so documenting them was deferred
# rather than merged into someone else's diff (PYQ-236 records the full list).
# These are per-*rule* rather than blanket `D` so new style violations still
# fail; delete each line as its symbols get docstrings.
"pyquant/analysis/calibrate.py" = ["D102"]  # to_dict, from_dict
"pyquant/analysis/forecast.py" = ["D102"]   # horizon, median
"pyquant/config.py" = ["D102"]              # settings_customise_sources
"pyquant/models/tft.py" = ["D101"]          # TrainResult, BacktestResult

# Type-checking is available for local use but intentionally NOT gated in CI
# (PYQ-310): a one-off survey found zero real issues at this setting — the only
# findings were missing third-party stubs (handled below) and, under
# --disallow-untyped-defs, annotation-completeness nits, no correctness bugs.
# Run locally with: uvx mypy pyquant
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# Coverage is reported, deliberately without a `fail_under` gate (PYQ-230):
# the ask is visibility into *which* paths are uncovered, and a threshold on a
# suite this young mostly teaches people to write tests that move a number.
# Reproduce the CI figure locally with exactly one command:
#   uv run pytest --cov --cov-report=term-missing -q
# `--cov` is not in `addopts` on purpose -- the default `pytest -q` dev loop
# stays fast, and coverage is opt-in.
[tool.coverage.run]
source = ["pyquant"]
branch = true

[tool.coverage.report]
show_missing = true
# The branches that cannot be executed under pytest by construction, so counting
# them as gaps would only add noise: typing-only imports, unreachable stubs, and
# the `python -m` entry point. `exclude_also` appends to coverage's defaults
# (which already cover `pragma: no cover`) rather than replacing them.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "@overload",
]
