name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Report every interpreter's result rather than cancelling the matrix on the
      # first red cell -- "3.10 and 3.11 are completely unverified" (PYQ-229) is
      # only fixed if a 3.10 failure is still visible when 3.12 also fails.
      fail-fast: false
      matrix:
        # Mirrors `requires-python = ">=3.10,<3.13"`. Keep the two in step: the
        # gap between what the package claims to support and what CI proves is
        # exactly what PYQ-229 was filed about.
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # Pin every uv invocation in this job to the matrix interpreter and to the
      # locked resolution, so a later `uv run` cannot silently re-resolve to a
      # different dependency set mid-job (PYQ-229).
      UV_PYTHON: ${{ matrix.python-version }}
      UV_FROZEN: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Check lockfile is in sync with pyproject.toml
        # Runs before install so a desynced lockfile is reported as itself rather
        # than as a confusing resolution error later (PYQ-229). This is the step
        # that makes the frozen install below meaningful: without it, an edit to
        # pyproject.toml that never made it into uv.lock passes CI silently.
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format drift (non-blocking)
        # NOT a gate yet, deliberately (PYQ-229). At the time this landed the tree
        # had 20-22 unformatted files (~250 lines), 4 of them under concurrent edit --
        # so adopting `ruff format` here and now would have meant one large
        # reformat commit tangled with unrelated in-flight work, which is the exact
        # "large unrelated diff" the ticket wants to avoid. Reporting it every run
        # keeps the number visible and stops it growing; once the formatting pass
        # lands on its own, delete this line and the step becomes the gate.
        continue-on-error: true
        run: uv run ruff format --check .

      - name: Docs build (warnings are errors)
        # A docs site that is not built in CI rots within two refactors, so a
        # broken :func: cross-reference, a renamed module or an autodoc import
        # failure fails the PR that caused it rather than surfacing three months
        # later (PYQ-233). Same instinct as the backlog check below.
        #
        # Only on 3.12: the docs group resolves the same way on every matrix leg,
        # so building it three times costs ~2 minutes to re-prove one fact.
        if: matrix.python-version == '3.12'
        run: uv run --group docs sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Backlog consistency
        # Cheap, dependency-free guard against duplicate/out-of-range IDs and
        # table/detail drift across backlog/*.md, caught in the same PR (PYQ-311).
        run: python3 scripts/backlog.py check

      - name: Test
        # Coverage is printed, never gated (PYQ-230). `--cov` with no value reads
        # `source` from [tool.coverage.run]; term-missing is what turns the report
        # from a single number into the per-module, per-line answer to "which paths
        # are uncovered" -- the question bugs.md#pyq-120 showed actually matters.
        run: uv run pytest -q --cov --cov-report=term-missing
