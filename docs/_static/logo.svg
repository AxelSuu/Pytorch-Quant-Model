<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 32" width="44" height="32" role="img" aria-label="PyQuant">
  <title>PyQuant</title>
  <!-- The p10-p90 fan, drawn to the shape the product actually emits: a known
       history to the left of the last observed bar, a band that only widens to
       the right of it. The dashed rule is invariant 3/4 - nothing decoded before
       it, everything decoded after. -->
  <path d="M24 15 L41 4 L41 27 Z" fill="#0f6b73" fill-opacity="0.16"/>
  <path d="M24 15 L41 4" fill="none" stroke="#0f6b73" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M24 15 L41 27" fill="none" stroke="#0f6b73" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M24 15 L41 14" fill="none" stroke="#0f6b73" stroke-width="2" stroke-linecap="round"/>
  <path d="M24 3 L24 29" fill="none" stroke="#0f6b73" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="2 3" stroke-linecap="round"/>
  <path d="M3 24 L8 19 L13 23 L18 12 L24 15" fill="none" stroke="#12191c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
